<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 920" width="1140" height="920">

  <defs>
    <linearGradient id="seqHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="seqShadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="seqArrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="seqArrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="seqArrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .actor-box { rx: 8; fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .actor-title { font-weight: 700; font-size: 11px; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-weight: 500; font-size: 9.5px; fill: #64748b; text-anchor: middle; }
    .msg-text { font-weight: 600; font-size: 10px; fill: #1e293b; }
    .msg-note { font-weight: 500; font-size: 9px; fill: #64748b; }
  </style>

  <!-- Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="14"/>
  <rect x="2" y="2" width="1136" height="916" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Header -->
  <g filter="url(#seqShadow)">
    <rect x="25" y="20" width="1090" height="60" rx="10" fill="url(#seqHeader)"/>
    <text x="570.0" y="45" text-anchor="middle" class="font-base" font-weight="800" font-size="15.5px" fill="#ffffff">SEQUENCE DIAGRAM INTERAKSI PERCAKAPAN SPASIAL END-TO-END</text>
    <text x="570.0" y="65" text-anchor="middle" class="font-base" font-weight="500" font-size="11.5px" fill="#cbd5e1">Kronologi Pemanggilan Komponen: Dari Parsing Semantik, Validasi Invarian, Kompilasi Kueri, hingga Grounding</text>
  </g>


  <!-- Lifeline Browser / User -->
  <line x1="80" y1="145" x2="80" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="25" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="80" y="118" class="font-base actor-title">Browser / User</text>
    <text x="80" y="132" class="font-base actor-sub">Leaflet &amp; Chat</text>
  </g>


  <!-- Lifeline ChatController -->
  <line x1="220" y1="145" x2="220" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="165" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="220" y="118" class="font-base actor-title">ChatController</text>
    <text x="220" y="132" class="font-base actor-sub">CodeIgniter 4</text>
  </g>


  <!-- Lifeline LlmService -->
  <line x1="370" y1="145" x2="370" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="315" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="370" y="118" class="font-base actor-title">LlmService</text>
    <text x="370" y="132" class="font-base actor-sub">DeepSeek API</text>
  </g>


  <!-- Lifeline SirValidator -->
  <line x1="520" y1="145" x2="520" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="465" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="520" y="118" class="font-base actor-title">SirValidator</text>
    <text x="520" y="132" class="font-base actor-sub">Invarian 6-Dim</text>
  </g>


  <!-- Lifeline QueryCompiler -->
  <line x1="670" y1="145" x2="670" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="615" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <text x="670" y="118" class="font-base actor-title">QueryCompiler</text>
    <text x="670" y="132" class="font-base actor-sub">SQL Generator</text>
  </g>


  <!-- Lifeline MySQL 8.0 -->
  <line x1="810" y1="145" x2="810" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="755" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <text x="810" y="118" class="font-base actor-title">MySQL 8.0</text>
    <text x="810" y="132" class="font-base actor-sub">Spatial InnoDB</text>
  </g>


  <!-- Lifeline OSRM Engine -->
  <line x1="940" y1="145" x2="940" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="885" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
    <text x="940" y="118" class="font-base actor-title">OSRM Engine</text>
    <text x="940" y="132" class="font-base actor-sub">Road Routing</text>
  </g>


  <!-- Lifeline GroundingVal -->
  <line x1="1050" y1="145" x2="1050" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <g filter="url(#seqShadow)">
    <rect x="995" y="100" width="110" height="42" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
    <text x="1050" y="118" class="font-base actor-title">GroundingVal</text>
    <text x="1050" y="132" class="font-base actor-sub">Grounding Firewall</text>
  </g>


  <!-- Message: 1. POST /api/chat (text, lat, lng) -->
  <line x1="80" y1="170" x2="220" y2="170" stroke="#0284c7" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <rect x="33.19999999999999" y="152" width="233.60000000000002" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="150.0" y="164" text-anchor="middle" class="font-base msg-text" fill="#0284c7">1. POST /api/chat (text, lat, lng)</text>
  <text x="150.0" y="182" text-anchor="middle" class="font-base msg-note">Kirim kueri bahasa alami + koordinat GPS</text>


  <!-- Message: 2. parseSIR(prompt, lat, lng) -->
  <line x1="220" y1="215" x2="370" y2="215" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#seqArrowPurple)"/>
  <rect x="194.2" y="197" width="201.60000000000002" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="295.0" y="209" text-anchor="middle" class="font-base msg-text" fill="#7c3aed">2. parseSIR(prompt, lat, lng)</text>
  <text x="295.0" y="227" text-anchor="middle" class="font-base msg-note">Isolasi sandbox JSON, temp: 0.0</text>


  <!-- Message: 3. Raw SIR DTO (JSON) -->
  <line x1="370" y1="260" x2="220" y2="260" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="219.8" y="242" width="150.4" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="295.0" y="254" text-anchor="middle" class="font-base msg-text" fill="#64748b">3. Raw SIR DTO (JSON)</text>
  <text x="295.0" y="272" text-anchor="middle" class="font-base msg-note">intent, category, radius, price</text>


  <!-- Message: 4. validate(rawSir) -->
  <line x1="220" y1="305" x2="520" y2="305" stroke="#d97706" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <rect x="301.2" y="287" width="137.60000000000002" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="370.0" y="299" text-anchor="middle" class="font-base msg-text" fill="#d97706">4. validate(rawSir)</text>
  <text x="370.0" y="317" text-anchor="middle" class="font-base msg-note">Uji 6 dimensi invarian No Intent Alteration</text>


  <!-- Message: 5. Canonical SIR (CSIR) -->
  <line x1="520" y1="350" x2="220" y2="350" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="288.4" y="332" width="163.20000000000002" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="370.0" y="344" text-anchor="middle" class="font-base msg-text" fill="#64748b">5. Canonical SIR (CSIR)</text>
  <text x="370.0" y="362" text-anchor="middle" class="font-base msg-note">Status: validated, Policy: execute_sql</text>


  <!-- Message: 6. compileAndExecute(csir, lat, lng) -->
  <line x1="220" y1="400" x2="670" y2="400" stroke="#059669" stroke-width="1.6" marker-end="url(#seqArrowGreen)"/>
  <rect x="321.8" y="382" width="246.4" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="445.0" y="394" text-anchor="middle" class="font-base msg-text" fill="#059669">6. compileAndExecute(csir, lat, lng)</text>
  <text x="445.0" y="412" text-anchor="middle" class="font-base msg-note">Kompilasi kueri geodesik ST_Distance_Sphere</text>


  <!-- Message: 7. SELECT ... ST_Distance_Sphere() -->
  <line x1="670" y1="450" x2="810" y2="450" stroke="#0f766e" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <rect x="623.2" y="432" width="233.60000000000002" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="740.0" y="444" text-anchor="middle" class="font-base msg-text" fill="#0f766e">7. SELECT ... ST_Distance_Sphere()</text>
  <text x="740.0" y="462" text-anchor="middle" class="font-base msg-note">Eksekusi SPATIAL INDEX R-Tree</text>


  <!-- Message: 8. Rows Data Fakta SQL -->
  <line x1="810" y1="500" x2="670" y2="500" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="661.6" y="482" width="156.8" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="740.0" y="494" text-anchor="middle" class="font-base msg-text" fill="#64748b">8. Rows Data Fakta SQL</text>
  <text x="740.0" y="512" text-anchor="middle" class="font-base msg-note">Hasil terurut jarak geodesik (1,21 ms)</text>


  <!-- Message: 9. Array Tupel Fakta Terverifikasi F -->
  <line x1="670" y1="545" x2="220" y2="545" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="321.8" y="527" width="246.4" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="445.0" y="539" text-anchor="middle" class="font-base msg-text" fill="#64748b">9. Array Tupel Fakta Terverifikasi F</text>
  <text x="445.0" y="557" text-anchor="middle" class="font-base msg-note">Single Source of Truth</text>


  <!-- Message: 10. /route/v1/driving (user_coord, dest_coord) -->
  <line x1="220" y1="595" x2="940" y2="595" stroke="#0369a1" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <rect x="424.79999999999995" y="577" width="310.40000000000003" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="580.0" y="589" text-anchor="middle" class="font-base msg-text" fill="#0369a1">10. /route/v1/driving (user_coord, dest_coord)</text>
  <text x="580.0" y="607" text-anchor="middle" class="font-base msg-note">Kueri jaringan jalan raya turn-by-turn</text>


  <!-- Message: 11. GeoJSON Polyline + Jarak & Durasi -->
  <line x1="940" y1="640" x2="220" y2="640" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="453.6" y="622" width="252.8" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="580.0" y="634" text-anchor="middle" class="font-base msg-text" fill="#64748b">11. GeoJSON Polyline + Jarak &amp; Durasi</text>
  <text x="580.0" y="652" text-anchor="middle" class="font-base msg-note">Geometri jalur jalan raya</text>


  <!-- Message: 12. generateGroundedNlg(fakta_F, query) -->
  <line x1="220" y1="685" x2="370" y2="685" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#seqArrowPurple)"/>
  <rect x="162.2" y="667" width="265.6" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="295.0" y="679" text-anchor="middle" class="font-base msg-text" fill="#7c3aed">12. generateGroundedNlg(fakta_F, query)</text>
  <text x="295.0" y="697" text-anchor="middle" class="font-base msg-note">Sintesis draf percakapan terikat fakta</text>


  <!-- Message: 13. Draf Teks Respons NLG -->
  <line x1="370" y1="730" x2="220" y2="730" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="207.0" y="712" width="176.0" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="295.0" y="724" text-anchor="middle" class="font-base msg-text" fill="#64748b">13. Draf Teks Respons NLG</text>
  <text x="295.0" y="742" text-anchor="middle" class="font-base msg-note">Narasi komunikatif</text>


  <!-- Message: 14. validateGrounding(drafTeks, fakta_F) -->
  <line x1="220" y1="775" x2="1050" y2="775" stroke="#e11d48" stroke-width="1.6" marker-end="url(#seqArrowRed)"/>
  <rect x="499.0" y="757" width="272.0" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="635.0" y="769" text-anchor="middle" class="font-base msg-text" fill="#e11d48">14. validateGrounding(drafTeks, fakta_F)</text>
  <text x="635.0" y="787" text-anchor="middle" class="font-base msg-note">Kontrak formal: Semua entitas ∈ F?</text>


  <!-- Message: 15. GroundingResult (isGrounded: true) -->
  <line x1="1050" y1="815" x2="220" y2="815" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrowDash)"/>
  <rect x="505.4" y="797" width="259.20000000000005" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="635.0" y="809" text-anchor="middle" class="font-base msg-text" fill="#64748b">15. GroundingResult (isGrounded: true)</text>
  <text x="635.0" y="827" text-anchor="middle" class="font-base msg-note">Entity Fabrication: 0,00% (Tanpa Halusinasi)</text>


  <!-- Message: 16. JSON Dual-Payload {text, wisata, route} -->
  <line x1="220" y1="855" x2="80" y2="855" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#seqArrow)"/>
  <rect x="4.400000000000006" y="837" width="291.2" height="15" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="150.0" y="849" text-anchor="middle" class="font-base msg-text" fill="#0284c7">16. JSON Dual-Payload {text, wisata, route}</text>
  <text x="150.0" y="867" text-anchor="middle" class="font-base msg-note">Render sinkron peta Leaflet &amp; panel chat AI</text>

</svg>