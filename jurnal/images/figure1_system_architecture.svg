<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 798" width="1040" height="798">

  <defs>
    <linearGradient id="archHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="archShadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="archArrow" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 5 8 L 10 2 z" fill="#0284c7"/>
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .layer-title { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
    .layer-sub { font-weight: 500; font-size: 11.5px; fill: #334155; }
    .layer-tech { font-family: "Courier New", monospace; font-size: 10.5px; fill: #475569; }
    .arrow-text { font-weight: 600; font-size: 10.5px; fill: #0369a1; }
  </style>

  <rect width="100%" height="100%" fill="#f8fafc" rx="14"/>
  <rect x="2" y="2" width="1036" height="794" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Banner -->
  <g filter="url(#archShadow)">
    <rect x="25" y="22" width="990" height="64" rx="10" fill="url(#archHeader)"/>
    <text x="520.0" y="48" text-anchor="middle" class="font-base" font-weight="800" font-size="16px" fill="#ffffff">5-LAYER ARCHITECTURE OF INTELLIGENT WEB GIS</text>
    <text x="520.0" y="68" text-anchor="middle" class="font-base" font-weight="500" font-size="12px" fill="#ccfbf1">Dual-Process Cognitive Air-Gap &amp; Deterministic Grounding Firewall (Padang City)</text>
  </g>

  <!-- L1 -->
  <g filter="url(#archShadow)">
    <rect x="50" y="108" width="940" height="88" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.6"/>
    <rect x="66" y="122" width="38" height="24" rx="6" fill="#0284c7"/>
    <text x="85" y="138" text-anchor="middle" class="font-base" font-weight="800" font-size="12.5px" fill="#ffffff">L1</text>
    <text x="114" y="138" class="font-base layer-title">CONVERSATIONAL INTERACTION LAYER (PRESENTATION / CLIENT)</text>
    <text x="114" y="160" class="font-base layer-sub">Synchronous Dual Interface: Full-viewport Leaflet.js + Floating AI Chat Drawer</text>
    <text x="114" y="180" class="font-base layer-tech">HTML5 Geolocation (GPS) | Leaflet.js OSM | OSRM Routing Engine | Responsive CSS</text>
  </g>
  <line x1="520.0" y1="198" x2="520.0" y2="234" stroke="#0284c7" stroke-width="2" marker-end="url(#archArrow)"/>
  <rect x="280.5" y="205.0" width="479.0" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520.0" y="219.0" text-anchor="middle" class="font-base arrow-text">[A] Natural Language Query + Situational Context (GPS, Circadian Time)</text>
  <!-- L2 -->
  <g filter="url(#archShadow)">
    <rect x="50" y="240" width="940" height="88" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
    <rect x="66" y="254" width="38" height="24" rx="6" fill="#7c3aed"/>
    <text x="85" y="270" text-anchor="middle" class="font-base" font-weight="800" font-size="12.5px" fill="#ffffff">L2</text>
    <text x="114" y="270" class="font-base layer-title">LLM SEMANTIC INTERPRETATION LAYER (COGNITIVE AIR-GAP)</text>
    <text x="114" y="292" class="font-base layer-sub">DeepSeek API (temperature: 0.0, JSON mode) Isolated from Database Access</text>
    <text x="114" y="312" class="font-base layer-tech">Ekstraksi Slot Semantik Spasial | Ontologi Operator Spasial | Taksonomi Klaster Wisata</text>
  </g>
  <line x1="520.0" y1="330" x2="520.0" y2="366" stroke="#0284c7" stroke-width="2" marker-end="url(#archArrow)"/>
  <rect x="296.75" y="337.0" width="446.5" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520.0" y="351.0" text-anchor="middle" class="font-base arrow-text">[B] Raw CSIR Object (Canonical Spatial Intent Representation DTO)</text>
  <!-- L3 -->
  <g filter="url(#archShadow)">
    <rect x="50" y="372" width="940" height="88" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
    <rect x="66" y="386" width="38" height="24" rx="6" fill="#d97706"/>
    <text x="85" y="402" text-anchor="middle" class="font-base" font-weight="800" font-size="12.5px" fill="#ffffff">L3</text>
    <text x="114" y="402" class="font-base layer-title">SEMANTIC CONTROL &amp; COMPILATION LAYER (BACKEND: CodeIgniter 4 / PHP 8.2)</text>
    <text x="114" y="424" class="font-base layer-sub">6-Dimension SIR Validator ('No Intent Alteration') &amp; Spatial Query Compiler</text>
    <text x="114" y="444" class="font-base layer-tech">Kebijakan: direct_execute | clarify_user | reject_out_of_scope | Safety Invariant (!isValid ==&gt; 0 DB Load)</text>
  </g>
  <line x1="520.0" y1="462" x2="520.0" y2="498" stroke="#0284c7" stroke-width="2" marker-end="url(#archArrow)"/>
  <rect x="303.25" y="469.0" width="433.5" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520.0" y="483.0" text-anchor="middle" class="font-base arrow-text">[C] Validated Parameterized Spatial SQL with ST_Distance_Sphere</text>
  <!-- L4 -->
  <g filter="url(#archShadow)">
    <rect x="50" y="504" width="940" height="88" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
    <rect x="66" y="518" width="38" height="24" rx="6" fill="#059669"/>
    <text x="85" y="534" text-anchor="middle" class="font-base" font-weight="800" font-size="12.5px" fill="#ffffff">L4</text>
    <text x="114" y="534" class="font-base layer-title">DETERMINISTIC SPATIAL COMPUTATION LAYER (DATA STORAGE &amp; ENGINE)</text>
    <text x="114" y="556" class="font-base layer-sub">MySQL 8.0 InnoDB (SRID 4326 POINT) | Built-in C++ Great-Circle Computation</text>
    <text x="114" y="576" class="font-base layer-tech">ST_Distance_Sphere(POINT, POINT) / 1000.0 | SPATIAL INDEX (geom) | Filter Relasional (open_now, harga)</text>
  </g>
  <line x1="520.0" y1="594" x2="520.0" y2="630" stroke="#0284c7" stroke-width="2" marker-end="url(#archArrow)"/>
  <rect x="345.5" y="601.0" width="349.0" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520.0" y="615.0" text-anchor="middle" class="font-base arrow-text">[D] Verified Fact Tuples Set F = {t1, t2, ..., tk}</text>
  <!-- L5 -->
  <g filter="url(#archShadow)">
    <rect x="50" y="636" width="940" height="88" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.6"/>
    <rect x="66" y="650" width="38" height="24" rx="6" fill="#e11d48"/>
    <text x="85" y="666" text-anchor="middle" class="font-base" font-weight="800" font-size="12.5px" fill="#ffffff">L5</text>
    <text x="114" y="666" class="font-base layer-title">GROUNDED RESPONSE &amp; VERIFICATION LAYER (GROUNDING FIREWALL)</text>
    <text x="114" y="688" class="font-base layer-sub">Algorithmic Grounding Validator: Strict Contract ∀e ∈ Entities(Response), e ∈ F</text>
    <text x="114" y="708" class="font-base layer-tech">Substitusi Otomatis Token Halusinasi dengan DTO Faktual | Dual-Payload Dispatcher (GeoJSON + Text)</text>
  </g>
</svg>