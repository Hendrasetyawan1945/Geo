  <rect x="252.5" y="1035.5" width="375.0" height="22" rx="11" class="arrow-badge-bg"/>
  <text x="440.0" y="1050.5" text-anchor="middle" class="font-base arrow-badge-text">Visualized Spatial State &amp; User Cognitive Feedback</text>
  <!-- STAGE 7 -->
  <g filter="url(#shadow)">
    <rect x="70" y="1075" width="820" height="108" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.8"/>
    <circle cx="106" cy="1129.0" r="22" fill="#4f46e5"/>
