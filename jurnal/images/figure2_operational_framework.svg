  <rect x="262.25" y="235.5" width="355.5" height="22" rx="11" class="arrow-badge-bg"/>
  <text x="440.0" y="250.5" text-anchor="middle" class="font-base arrow-badge-text">Natural Language Query + Situational Context Vector</text>
  <!-- STAGE 2 -->
