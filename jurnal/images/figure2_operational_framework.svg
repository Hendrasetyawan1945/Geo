    <line x1="142" y1="635" x2="870" y2="635" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="145" y="653" class="font-base stage-desc">• MySQL 8.0 InnoDB 3NF: wisata JOIN kategori (SPATIAL INDEX on geom POINT)</text>
    <text x="145" y="671" class="font-base stage-desc">• C++ Kernel: ST_Distance_Sphere(POINT(lng, lat), POINT(u_lng, u_lat)) / 1000.0</text>
    <text x="145" y="689" class="font-base stage-desc">• Multi-criteria filter: open_now, max_price, status ==&gt; Verified Fact Table F</text>
  </g>
