  <text x="440.0" y="570.5" text-anchor="middle" class="font-base arrow-badge-text">Validated Parameterized SQL Statement (ST_Distance_Sphere)</text>
  <!-- STAGE 4 -->
  <g filter="url(#shadow)">
    <rect x="70" y="595" width="820" height="108" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
    <circle cx="106" cy="649.0" r="22" fill="#059669"/>
