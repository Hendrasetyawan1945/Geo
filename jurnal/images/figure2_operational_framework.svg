    <line x1="142" y1="955" x2="870" y2="955" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="145" y="973" class="font-base stage-desc">• Interactive Leaflet.js Map: Auto-pan, thematic SVG pins, verified popups</text>
    <text x="145" y="991" class="font-base stage-desc">• OSRM Routing Engine: Turn-by-turn road network polyline &amp; transit time</text>
    <text x="145" y="1009" class="font-base stage-desc">• AI Conversation Drawer: Grounded, informative, and cohesive narrative</text>
  </g>
  <!-- Connector 6 -> 7 -->
