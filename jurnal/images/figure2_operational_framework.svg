    <text x="221.5" y="782" text-anchor="middle" class="font-base badge-text">GROUNDING VERIFICATION</text>
    <text x="313.0" y="783" class="font-base stage-title">5. Post-Generation Algorithmic Grounding Validator (Grounding Firewall)</text>
    <line x1="142" y1="795" x2="870" y2="795" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="145" y="813" class="font-base stage-desc">• LLM synthesizes natural response strictly conditioned on Fact Table F</text>
    <text x="145" y="831" class="font-base stage-desc">• Strict Grounding Contract: ∀e ∈ Entities(Response), e ∈ Entities(Facts_SQL)</text>
    <text x="145" y="849" class="font-base stage-desc">• Mathematical guarantee: Entity Fabrication Rate = 0.00% (0 Grounding Violations)</text>
  </g>
