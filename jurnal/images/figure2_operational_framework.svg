  <g filter="url(#shadow)">
    <rect x="70" y="435" width="820" height="108" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.8"/>
    <circle cx="106" cy="489.0" r="22" fill="#d97706"/>
    <text x="106" y="495.0" text-anchor="middle" class="font-base num-text">3</text>
    <rect x="142" y="449" width="211.0" height="18" rx="4" fill="#d97706"/>
    <text x="247.5" y="462" text-anchor="middle" class="font-base badge-text">SEMANTIC CONTROL &amp; BACKEND</text>
    <text x="365.0" y="463" class="font-base stage-title">3. Deterministic Control Firewall &amp; Spatial Query Compilation</text>
    <line x1="142" y1="475" x2="870" y2="475" stroke="#fde68a" stroke-width="1.2"/>
    <text x="145" y="493" class="font-base stage-desc">• SIR Validator: 6-Dimension Invariants enforce 'No Intent Alteration'</text>
    <text x="145" y="511" class="font-base stage-desc">• Evaluates bounds, domain safety; sets: direct_execute | clarify | reject</text>
    <text x="145" y="529" class="font-base stage-desc">• Spatial Query Compiler: Safety Invariant (!isValid ==&gt; Zero DB Execution)</text>
  </g>
  <!-- Connector 3 -> 4 -->
