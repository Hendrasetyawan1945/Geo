    <rect x="142" y="1089" width="243.5" height="18" rx="4" fill="#4f46e5"/>
    <text x="263.75" y="1102" text-anchor="middle" class="font-base badge-text">USER EXPERIENCE &amp; ADAPTIVE LOOP</text>
    <text x="397.5" y="1103" class="font-base stage-title">7. User Cognitive Evaluation &amp; Adaptive Conversational Refinement</text>
    <line x1="142" y1="1115" x2="870" y2="1115" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="145" y="1133" class="font-base stage-desc">• Tourist evaluates spatial distribution, transit times, tariffs, and POI cards</text>
    <text x="145" y="1151" class="font-base stage-desc">• Multi-turn dialog: CSIR(t+1) = Merge(CSIR(t), ΔCSIR(t+1)) updates context</text>
    <text x="145" y="1169" class="font-base stage-desc">• Replaces manual slider tweaking (Afnarius et al., 2026) with adaptive dialog</text>
  </g>
  <!-- ADAPTIVE FEEDBACK LOOP -->
  <path d="M 890 1129.0 H 925 V 179.0 H 896" fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrowLoop)"/>
  <rect x="855.0" y="574.0" width="140" height="160" rx="10" class="loop-badge-bg"/>
  <text x="925" y="598.0" text-anchor="middle" class="font-base" font-weight="800" font-size="10.5px" fill="#312e81">FEEDBACK LOOP</text>
  <line x1="870.0" y1="606.0" x2="980.0" y2="606.0" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="925" y="624.0" text-anchor="middle" class="font-base" font-weight="700" font-size="10.5px" fill="#4338ca">Multi-Turn Dialog</text>
  <text x="925" y="642.0" text-anchor="middle" class="font-base" font-weight="600" font-size="10px" fill="#475569">Conversational</text>
  <text x="925" y="658.0" text-anchor="middle" class="font-base" font-weight="600" font-size="10px" fill="#475569">Intent Refinement</text>
  <rect x="865.0" y="668.0" width="120" height="20" rx="4" fill="#4338ca"/>
  <text x="925" y="682.0" text-anchor="middle" class="font-base" font-weight="700" font-size="9px" fill="#ffffff">CSIR(t+1) = Merge()</text>
  <text x="925" y="706.0" text-anchor="middle" class="font-base" font-weight="500" font-size="9.5px" fill="#64748b">Evolving WIMP GUI</text>
  <text x="925" y="720.0" text-anchor="middle" class="font-base" font-weight="500" font-size="9.5px" fill="#64748b">(Afnarius et al., 2026)</text>
</svg>