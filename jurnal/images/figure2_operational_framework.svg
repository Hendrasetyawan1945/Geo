    <rect x="70" y="275" width="820" height="108" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8"/>
    <circle cx="106" cy="329.0" r="22" fill="#7c3aed"/>
    <text x="106" y="335.0" text-anchor="middle" class="font-base num-text">2</text>
    <rect x="142" y="289" width="133.0" height="18" rx="4" fill="#7c3aed"/>
    <text x="208.5" y="302" text-anchor="middle" class="font-base badge-text">COGNITIVE AI LAYER</text>
    <text x="287.0" y="303" class="font-base stage-title">2. Cognitive Air-Gap: Semantic Interpretation (LLM JSON Sandbox)</text>
    <line x1="142" y1="315" x2="870" y2="315" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="145" y="333" class="font-base stage-desc">• DeepSeek LLM (temperature: 0.0, JSON mode) isolated from database access</text>
    <text x="145" y="351" class="font-base stage-desc">• Semantic slot extraction bounded by Spatial Operator Ontology &amp; Taxonomy</text>
    <text x="145" y="369" class="font-base stage-desc">• Emits raw Canonical Spatial Intent Representation (CSIR) DTO</text>
  </g>
  <!-- Connector 2 -> 3 -->
  <line x1="440.0" y1="386" x2="440.0" y2="429" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrowDown)"/>
  <rect x="307.75" y="395.5" width="264.5" height="22" rx="11" class="arrow-badge-bg"/>
  <text x="440.0" y="410.5" text-anchor="middle" class="font-base arrow-badge-text">Raw CSIR Object (Structured JSON DTO)</text>
