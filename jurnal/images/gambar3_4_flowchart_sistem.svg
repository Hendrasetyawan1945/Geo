<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1580" width="1100" height="1580">

  <defs>
    <linearGradient id="fcHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="fcShadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <filter id="headerShadow" x="-2%" y="-5%" width="104%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 5 8 L 10 2 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 5 8 L 10 2 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 5 8 L 10 2 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 5 8 L 10 2 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
    .node-desc { font-weight: 450; font-size: 11px; fill: #334155; line-height: 1.4; }
    .badge-text { font-weight: 700; font-size: 9.5px; fill: #ffffff; letter-spacing: 0.5px; }
    .edge-label-bg { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 9; }
    .edge-label-text { font-weight: 600; font-size: 10px; fill: #0369a1; }
    .edge-label-red { font-weight: 700; font-size: 10px; fill: #b91c1c; }
    .edge-label-amber { font-weight: 700; font-size: 10px; fill: #b45309; }
    .edge-label-green { font-weight: 700; font-size: 10px; fill: #047857; }
    .diamond-text { font-weight: 700; font-size: 11.5px; fill: #78350f; text-anchor: middle; }
    .diamond-sub { font-weight: 500; font-size: 10px; fill: #92400e; text-anchor: middle; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="14"/>
  <rect x="2" y="2" width="1096" height="1576" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>

  <!-- Top Header Banner -->
  <g filter="url(#headerShadow)">
    <rect x="25" y="20" width="1050" height="66" rx="10" fill="url(#fcHeader)"/>
    <text x="550.0" y="46" text-anchor="middle" class="font-base" font-weight="800" font-size="16px" fill="#ffffff" letter-spacing="0.3px">FLOWCHART ALUR LOGIKA EKSEKUSI SISTEM 5-LAYER TERINTEGRASI</text>
    <text x="550.0" y="68" text-anchor="middle" class="font-base" font-weight="500" font-size="12px" fill="#ccfbf1">Alur End-to-End: Dari Masukan Pengguna &amp; GPS, Validasi Invarian SIR, Kompilasi Spasial, hingga Grounding Validator</text>
  </g>


  <!-- STEP 1: USER INPUT -->
  <g filter="url(#fcShadow)">
    <rect x="280" y="112" width="540" height="62" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="294" y="122" width="95" height="18" rx="4" fill="#0284c7"/>
    <text x="341" y="135" text-anchor="middle" class="font-base badge-text">USER INPUT</text>
    <text x="400" y="136" class="font-base node-title">1. Pengguna Memasukkan Pesan Alami &amp; Lokasi GPS</text>
    <text x="298" y="158" class="font-base node-desc">Pesan teks (cth: "pantai terdekat tiket dibawah 20rb") + Koordinat Klien (lat, lng) + Waktu Sirkadian</text>
  </g>


  <line x1="550" y1="174" x2="550" y2="204" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowDown)"/>


  <!-- STEP 2: LAYER 2 -->
  <g filter="url(#fcShadow)">
    <rect x="260" y="206" width="580" height="72" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.8"/>
    <rect x="274" y="216" width="165" height="18" rx="4" fill="#7c3aed"/>
    <text x="356" y="229" text-anchor="middle" class="font-base badge-text">LAYER 2: COGNITIVE AIR-GAP</text>
    <text x="450" y="230" class="font-base node-title">LLM Semantic Parser (DeepSeek API)</text>
    <text x="278" y="252" class="font-base node-desc">• Sandbox JSON Mode (temperature: 0.0, isolasi total dari basis data &amp; SQL)</text>
    <text x="278" y="268" class="font-base node-desc">• Ekstraksi slot semantik spasial terikat taksonomi: intent, kategori, operator, radius, max_price</text>
  </g>


  <line x1="550" y1="278" x2="550" y2="318" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowDown)"/>
  <rect x="440" y="286" width="220" height="20" rx="10" class="edge-label-bg"/>
  <text x="550" y="300" text-anchor="middle" class="font-base edge-label-text">Objek Raw SIR DTO (JSON)</text>


  <!-- STEP 3: LAYER 3 -->
  <g filter="url(#fcShadow)">
    <rect x="250" y="320" width="600" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.8"/>
    <rect x="264" y="330" width="180" height="18" rx="4" fill="#d97706"/>
    <text x="354" y="343" text-anchor="middle" class="font-base badge-text">LAYER 3: FIREWALL KENDALI</text>
    <text x="454" y="344" class="font-base node-title">SirValidator (6 Dimensi Invarian)</text>
    <text x="268" y="366" class="font-base node-desc">• Prinsip No Intent Alteration: Menolak asumsi sepihak atau mutasi diam-diam atas preferensi kueri</text>
    <text x="268" y="382" class="font-base node-desc">• Evaluasi 6 Dimensi: Domain, Operator, Bounding Box, Range Batas Numerik, Status, &amp; Safety</text>
  </g>


  <line x1="550" y1="394" x2="550" y2="424" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>


  <!-- DECISION DIAMOND 1 -->
  <g filter="url(#fcShadow)">
    <polygon points="550,426 690,470 550,514 410,470" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="550" y="465" class="font-base diamond-text">Hasil Validasi Invarian SIR?</text>
    <text x="550" y="482" class="font-base diamond-sub">Evaluasi Status &amp; Policy CSIR</text>
  </g>


  <!-- Branch 1: Out of Scope -->
  <path d="M 410 470 H 170 V 534" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="185" y="458" width="165" height="20" rx="9" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
  <text x="267" y="472" text-anchor="middle" class="font-base edge-label-red">isOutOfScope == true</text>


  <g filter="url(#fcShadow)">
    <rect x="60" y="536" width="220" height="76" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.6"/>
    <rect x="70" y="544" width="105" height="17" rx="4" fill="#e11d48"/>
    <text x="122" y="556" text-anchor="middle" class="font-base badge-text">HONEST REJECT</text>
    <text x="70" y="576" class="font-base" font-weight="700" font-size="12px" fill="#9f1239">Penolakan Jujur</text>
    <text x="70" y="591" class="font-base" font-size="10.5px" fill="#475569">• 0 Beban Basis Data (0 SQL)</text>
    <text x="70" y="605" class="font-base" font-size="10.5px" fill="#475569">• Respons klarifikasi batas sistem</text>
  </g>


  <!-- Branch 2: Invalid -->
  <path d="M 690 470 H 930 V 534" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <rect x="745" y="458" width="160" height="20" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="825" y="472" text-anchor="middle" class="font-base edge-label-amber">isValid == false</text>


  <g filter="url(#fcShadow)">
    <rect x="820" y="536" width="220" height="76" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
    <rect x="830" y="544" width="95" height="17" rx="4" fill="#d97706"/>
    <text x="877" y="556" text-anchor="middle" class="font-base badge-text">CLARIFY USER</text>
    <text x="830" y="576" class="font-base" font-weight="700" font-size="12px" fill="#92400e">Minta Klarifikasi</text>
    <text x="830" y="591" class="font-base" font-size="10.5px" fill="#475569">• Tanpa manipulasi parameter</text>
    <text x="830" y="605" class="font-base" font-size="10.5px" fill="#475569">• Mengajukan opsi penegasan</text>
  </g>


  <!-- Branch 3: Valid -->
  <line x1="550" y1="514" x2="550" y2="548" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="475" y="520" width="150" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="550" y="533" text-anchor="middle" class="font-base edge-label-green">isValid == true</text>


  <g filter="url(#fcShadow)">
    <rect x="360" y="550" width="380" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <rect x="372" y="557" width="125" height="17" rx="4" fill="#059669"/>
    <text x="434" y="569" text-anchor="middle" class="font-base badge-text">CANONICAL SIR</text>
    <text x="508" y="570" class="font-base" font-weight="700" font-size="12.5px" fill="#166534">CSIR Tervalidasi (Strict DTO)</text>
    <text x="374" y="590" class="font-base node-desc">Parameter spasial &amp; operasional terkunci, siap dikompilasi ke SQL</text>
  </g>


  <line x1="550" y1="604" x2="550" y2="636" stroke="#059669" stroke-width="2" marker-end="url(#arrowDown)"/>


  <!-- STEP 4: LAYER 4 COMPILER -->
  <g filter="url(#fcShadow)">
    <rect x="240" y="638" width="620" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
    <rect x="254" y="648" width="195" height="18" rx="4" fill="#059669"/>
    <text x="351" y="661" text-anchor="middle" class="font-base badge-text">LAYER 4: COMPILER SPASIAL</text>
    <text x="458" y="662" class="font-base node-title">Spatial Query Compiler (Deterministik)</text>
    <text x="258" y="684" class="font-base node-desc">• Kompilasi CSIR ke SQL terparameterisasi dengan formula geodesik ST_Distance_Sphere</text>
    <text x="258" y="700" class="font-base node-desc">• Penyusunan klausa filter: radius_km, kategori_id, max_price, status_operasional, jam_buka</text>
  </g>


  <line x1="550" y1="714" x2="550" y2="754" stroke="#059669" stroke-width="2" marker-end="url(#arrowDown)"/>
  <rect x="420" y="722" width="260" height="20" rx="10" class="edge-label-bg"/>
  <text x="550" y="736" text-anchor="middle" class="font-base edge-label-text">Parameterized SQL (SRID 4326 POINT)</text>


  <!-- STEP 5: MYSQL ENGINE -->
  <g filter="url(#fcShadow)">
    <rect x="230" y="756" width="640" height="76" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/>
    <rect x="244" y="766" width="180" height="18" rx="4" fill="#0f766e"/>
    <text x="334" y="779" text-anchor="middle" class="font-base badge-text">DATA STORAGE &amp; ENGINE</text>
    <text x="434" y="780" class="font-base node-title">Eksekusi MySQL 8.0 Spatial Engine</text>
    <text x="248" y="802" class="font-base node-desc">• Evaluasi R-Tree SPATIAL INDEX pada kolom geom POINT (latensi rata-rata: 1,21 ms)</text>
    <text x="248" y="818" class="font-base node-desc">• Menghasilkan Tupel Fakta Terverifikasi: F = {t₁, t₂, ..., t_k} (Single Source of Truth)</text>
  </g>


  <line x1="550" y1="832" x2="550" y2="872" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowDown)"/>
  <rect x="430" y="840" width="240" height="20" rx="10" class="edge-label-bg"/>
  <text x="550" y="854" text-anchor="middle" class="font-base edge-label-text">Tupel Fakta Terverifikasi F</text>


  <!-- STEP 6A: OSRM ROUTE -->
  <g filter="url(#fcShadow)">
    <rect x="250" y="874" width="600" height="66" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.8"/>
    <rect x="264" y="884" width="165" height="18" rx="4" fill="#0284c7"/>
    <text x="346" y="897" text-anchor="middle" class="font-base badge-text">ROUTING ENGINE</text>
    <text x="440" y="898" class="font-base node-title">OSRM Highway Network Engine</text>
    <text x="268" y="920" class="font-base node-desc">• Komputasi rute jalan raya turn-by-turn dari posisi pengguna ke destinasi wisata</text>
    <text x="268" y="934" class="font-base node-desc">• Menghasilkan Polyline GeoJSON, estimasi jarak jalan raya (km), &amp; durasi tempuh (menit)</text>
  </g>


  <line x1="550" y1="940" x2="550" y2="970" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowDown)"/>


  <!-- STEP 6B: LAYER 5 NLG -->
  <g filter="url(#fcShadow)">
    <rect x="240" y="972" width="620" height="74" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.8"/>
    <rect x="254" y="982" width="180" height="18" rx="4" fill="#e11d48"/>
    <text x="344" y="995" text-anchor="middle" class="font-base badge-text">LAYER 5: GROUNDED NLG</text>
    <text x="444" y="996" class="font-base node-title">LLM Grounded Generator (DeepSeek NLG)</text>
    <text x="258" y="1018" class="font-base node-desc">• Sintesis narasi percakapan alami terikat ketat pada himpunan tupel fakta F</text>
    <text x="258" y="1034" class="font-base node-desc">• Mengubah data tabular menjadi narasi komunikatif yang ramah dan kontekstual</text>
  </g>


  <line x1="550" y1="1046" x2="550" y2="1086" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowDown)"/>
  <rect x="440" y="1054" width="220" height="20" rx="10" class="edge-label-bg"/>
  <text x="550" y="1068" text-anchor="middle" class="font-base edge-label-text">Draf Narasi Respons NLG</text>


  <!-- STEP 7: GROUNDING VALIDATOR -->
  <g filter="url(#fcShadow)">
    <rect x="230" y="1088" width="640" height="76" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.8"/>
    <rect x="244" y="1098" width="195" height="18" rx="4" fill="#be123c"/>
    <text x="341" y="1111" text-anchor="middle" class="font-base badge-text">GROUNDING FIREWALL</text>
    <text x="448" y="1112" class="font-base node-title">Algorithmic Grounding Validator</text>
    <text x="248" y="1134" class="font-base node-desc">• Validasi Pasca-Generasi: Penegakan Kontrak Formal ∀e ∈ Entities(Narasi), e ∈ F</text>
    <text x="248" y="1150" class="font-base node-desc">• Deteksi halusinasi POI fiktif, fabrikasi jarak, atau inkonsistensi tarif &amp; jam operasional</text>
  </g>


  <line x1="550" y1="1164" x2="550" y2="1194" stroke="#be123c" stroke-width="2" marker-end="url(#arrowRed)"/>


  <!-- DECISION DIAMOND 2 -->
  <g filter="url(#fcShadow)">
    <polygon points="550,1196 685,1238 550,1280 415,1238" fill="#ffe4e6" stroke="#be123c" stroke-width="2.2"/>
    <text x="550" y="1233" class="font-base" font-weight="700" font-size="11.5px" fill="#881337" text-anchor="middle">Semua Entitas Valid pada F?</text>
    <text x="550" y="1250" class="font-base" font-weight="500" font-size="10px" fill="#9f1239" text-anchor="middle">Garansi Entitas Faktual 100%</text>
  </g>


  <!-- Branch False: Entitas Fiktif -->
  <path d="M 685 1238 H 890 V 1290" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <rect x="715" y="1226" width="150" height="20" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="790" y="1240" text-anchor="middle" class="font-base" font-weight="700" font-size="10px" fill="#c2410c">Ada Entitas Fiktif</text>


  <g filter="url(#fcShadow)">
    <rect x="770" y="1292" width="240" height="64" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
    <rect x="780" y="1300" width="130" height="17" rx="4" fill="#ea580c"/>
    <text x="845" y="1312" text-anchor="middle" class="font-base badge-text">FALLBACK TEMPLATE</text>
    <text x="780" y="1332" class="font-base" font-weight="700" font-size="11.5px" fill="#9a3412">Substitusi Template Deterministik</text>
    <text x="780" y="1348" class="font-base node-desc">Ganti narasi halusinatif dengan format fakta baku</text>
  </g>


  <!-- Branch True: Valid Grounding -->
  <line x1="550" y1="1280" x2="550" y2="1308" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="465" y="1286" width="170" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="550" y="1299" text-anchor="middle" class="font-base edge-label-green">Semua Entitas Valid (Lolos)</text>


  <g filter="url(#fcShadow)">
    <rect x="400" y="1310" width="300" height="46" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
    <text x="550" y="1330" text-anchor="middle" class="font-base" font-weight="700" font-size="12px" fill="#166534">Teks Narasi Lolos Uji Grounding</text>
    <text x="550" y="1346" text-anchor="middle" class="font-base node-desc">Entity Fabrication Rate: 0,00% Tergaransi</text>
  </g>


  <!-- Connectors into Dispatcher -->
  <line x1="550" y1="1356" x2="550" y2="1388" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowDown)"/>
  <path d="M 890 1356 V 1374 H 550" fill="none" stroke="#ea580c" stroke-width="1.8"/>


  <!-- Left Reject Route to Dispatcher -->
  <path d="M 170 612 V 1374 H 550" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Right Clarify Route to Dispatcher -->
  <path d="M 930 612 V 1200" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>


  <!-- STEP 8: DUAL PAYLOAD -->
  <g filter="url(#fcShadow)">
    <rect x="260" y="1390" width="580" height="64" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.8"/>
    <rect x="274" y="1400" width="165" height="18" rx="4" fill="#4f46e5"/>
    <text x="356" y="1413" text-anchor="middle" class="font-base badge-text">DUAL-PAYLOAD DISPATCH</text>
    <text x="450" y="1414" class="font-base node-title">Kirim Payload JSON Sinkron ke Web Client</text>
    <text x="278" y="1436" class="font-base node-desc">• Muatan Lengkap: { status: "success", text: NarasiTerverifikasi, wisata: POI[], route: GeoJSON }</text>
  </g>


  <line x1="550" y1="1454" x2="550" y2="1484" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowDown)"/>


  <!-- STEP 9: LAYER 1 PRESENTATION -->
  <g filter="url(#fcShadow)">
    <rect x="230" y="1486" width="640" height="70" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="244" y="1496" width="180" height="18" rx="4" fill="#0284c7"/>
    <text x="334" y="1509" text-anchor="middle" class="font-base badge-text">LAYER 1: CLIENT RENDERING</text>
    <text x="434" y="1510" class="font-base node-title">Render Antarmuka Dwitunggal Sinkron</text>
    <text x="248" y="1532" class="font-base node-desc">• Peta Leaflet.js: Auto-pan ke centroid, marker SVG tematik, popup info, &amp; polyline rute jalan OSRM</text>
    <text x="248" y="1546" class="font-base node-desc">• Floating AI Chat: Narasi rekomendasi ter-grounding &amp; kartu interaktif destinasi wisata</text>
  </g>

</svg>