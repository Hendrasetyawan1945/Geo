    <text x="370" y="894" class="font-base" font-size="11px" fill="#475569">Pantai</text>
    <text x="490" y="894" class="font-base" font-weight="700" font-size="11px" fill="#0284c7">3,20 km</text>
    <text x="650" y="894" class="font-base" font-weight="700" font-size="11px" fill="#0f172a">Rp10.000</text>
    <text x="770" y="894" class="font-base" font-size="11px" fill="#475569">06:00 – 18:00 WIB</text>
    <text x="900" y="894" class="font-base" font-weight="700" font-size="10.5px" fill="#059669">✓ Sedang Buka</text>
