    <rect x="66" y="600" width="280" height="20" rx="4" fill="#059669"/>
    <text x="206" y="614" text-anchor="middle" class="font-base badge-text">4. DETERMINISTIC SPATIAL SQL COMPILATION</text>
    <text x="360" y="615" class="font-base card-title">Parameterized Geodesic Query (ST_Distance_Sphere)</text>
    
    <!-- Code box -->
    <rect x="70" y="628" width="920" height="106" rx="6" fill="url(#codeGrad)"/>
    <text x="85" y="648" class="font-mono" font-size="11px" fill="#38bdf8"><tspan fill="#c084fc">SELECT</tspan> id, nama, alamat, harga_tiket, jam_buka, jam_tutup,</text>
    <text x="135" y="664" class="font-mono" font-size="11px" fill="#4ade80">ROUND(ST_Distance_Sphere(POINT(lng, lat), POINT(100.3541, -0.9471)) / 1000.0, 2) <tspan fill="#c084fc">AS</tspan> jarak_km</text>
    <text x="85" y="680" class="font-mono" font-size="11px" fill="#38bdf8"><tspan fill="#c084fc">FROM</tspan> wisata <tspan fill="#c084fc">JOIN</tspan> kategori <tspan fill="#c084fc">ON</tspan> wisata.kategori_id = kategori.id</text>
    <text x="85" y="696" class="font-mono" font-size="11px" fill="#38bdf8"><tspan fill="#c084fc">WHERE</tspan> status_aktif = 1 <tspan fill="#c084fc">AND</tspan> kategori.nama = <tspan fill="#fef08a">'Pantai'</tspan> <tspan fill="#c084fc">AND</tspan> harga_tiket &lt;= 15000</text>
    <text x="125" y="712" class="font-mono" font-size="11px" fill="#38bdf8"><tspan fill="#c084fc">AND</tspan> (<tspan fill="#fef08a">'14:30:00'</tspan> <tspan fill="#c084fc">BETWEEN</tspan> jam_buka <tspan fill="#c084fc">AND</tspan> jam_tutup) <tspan fill="#c084fc">ORDER BY</tspan> jarak_km <tspan fill="#c084fc">ASC LIMIT</tspan> 10;</text>
    <text x="85" y="728" class="font-base" font-size="9.5px" fill="#94a3b8">• Formula Geodesik C++ Bawaan MySQL 8.0 | SPATIAL INDEX R-Tree pada kolom geom POINT SRID 4326</text>
  </g>


