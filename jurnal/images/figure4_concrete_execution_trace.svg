    <rect x="70" y="1058" width="920" height="66" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="85" y="1078" class="font-base" font-weight="700" font-size="11px" fill="#9f1239">💬 Balasan Percakapan AI Terverifikasi (Floating AI Chat Panel):</text>
    <text x="85" y="1096" class="font-base" font-style="italic" font-size="11px" fill="#334155">"Berikut 3 pantai terdekat yang buka saat ini dengan tiket &lt;= Rp15.000: (1) Pantai Padang (0,40 km, gratis, buka s.d. 22:00 WIB),</text>
    <text x="85" y="1112" class="font-base" font-style="italic" font-size="11px" fill="#334155">(2) Pantai Air Manis (3,20 km, Rp10.000, buka s.d. 18:00 WIB), dan (3) Pantai Pasir Jambak (3,46 km, Rp5.000, buka s.d. 18:30 WIB)."</text>

