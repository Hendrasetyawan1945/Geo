    <text x="280" y="1041" class="font-base" font-size="11px" fill="#14532d">Semua entitas {Pantai Padang, Pantai Air Manis, Pantai Pasir Jambak} terbukti ada pada F.</text>
    <text x="810" y="1041" class="font-base" font-weight="800" font-size="11px" fill="#047857">Grounding Fidelity: 100,00%</text>

