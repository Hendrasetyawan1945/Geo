    <rect x="300" y="192" width="190" height="20" rx="4" fill="#e0f2fe"/>
    <text x="310" y="206" class="font-base" font-weight="600" font-size="10.5px" fill="#0369a1">🕒 Waktu: 14:30:00 WIB (Siang)</text>

    <rect x="500" y="192" width="200" height="20" rx="4" fill="#e0f2fe"/>
    <text x="510" y="206" class="font-base" font-weight="600" font-size="10.5px" fill="#0369a1">🌐 Sesi: Interaktif Leaflet.js</text>
  </g>


  <line x1="530.0" y1="220" x2="530.0" y2="252" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowDown)"/>
  <rect x="370.0" y="226" width="320" height="20" rx="10" class="connector-bg"/>
  <text x="530.0" y="240" text-anchor="middle" class="font-base connector-text">Semantic Extraction in LLM Sandbox (DeepSeek, temp: 0.0)</text>


