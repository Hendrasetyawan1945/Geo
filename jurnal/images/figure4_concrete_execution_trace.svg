  <g filter="url(#traceShadow)">
    <rect x="50" y="254" width="960" height="150" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8"/>
    <rect x="66" y="266" width="280" height="20" rx="4" fill="#7c3aed"/>
