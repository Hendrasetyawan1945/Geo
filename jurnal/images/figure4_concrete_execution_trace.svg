    <text x="360" y="281" class="font-base card-title">Strictly-Typed Spatial Intent Representation</text>
    
    <!-- Code box -->
    <rect x="70" y="294" width="920" height="98" rx="6" fill="url(#codeGrad)"/>
    <text x="85" y="314" class="font-mono" font-size="11px" fill="#cbd5e1">&#123;</text>
    <text x="105" y="330" class="font-mono" font-size="11px" fill="#38bdf8">"category": <tspan fill="#fef08a">"Pantai"</tspan>, <tspan fill="#38bdf8">"spatial_operator":</tspan> <tspan fill="#fef08a">"nearest"</tspan>, <tspan fill="#38bdf8">"reference_type":</tspan> <tspan fill="#fef08a">"gps"</tspan>, <tspan fill="#38bdf8">"user_lat":</tspan> <tspan fill="#f87171">-0.9471</tspan>, <tspan fill="#38bdf8">"user_lng":</tspan> <tspan fill="#f87171">100.3541</tspan>,</text>
    <text x="105" y="348" class="font-mono" font-size="11px" fill="#38bdf8">"max_price": <tspan fill="#f87171">15000</tspan>, <tspan fill="#38bdf8">"open_now":</tspan> <tspan fill="#4ade80">true</tspan>, <tspan fill="#38bdf8">"sort":</tspan> <tspan fill="#fef08a">"terdekat"</tspan>, <tspan fill="#38bdf8">"isValid":</tspan> <tspan fill="#4ade80">true</tspan>, <tspan fill="#38bdf8">"executionPolicy":</tspan> <tspan fill="#fef08a">"execute_sql"</tspan></text>
    <text x="85" y="366" class="font-mono" font-size="11px" fill="#cbd5e1">&#125;</text>
    <text x="105" y="382" class="font-base" font-size="9.5px" fill="#94a3b8">• Terisolasi dari basis data | Output JSON murni tanpa celah injeksi SQL | No DB execution yet</text>
  </g>


  <line x1="530.0" y1="404" x2="530.0" y2="436" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowDown)"/>
